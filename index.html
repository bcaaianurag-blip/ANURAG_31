<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Productivity Planner</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
background:linear-gradient(120deg,#84fab0,#8fd3f4);
min-height:100vh;
}

header{
background:#212529;
color:white;
padding:20px;
text-align:center;
font-size:28px;
font-weight:bold;
}

.card{
border:none;
border-radius:15px;
}

.task-list li{
display:flex;
align-items:center;
gap:10px;
padding:6px;
}

.progress{
height:25px;
}

footer{
margin-top:40px;
padding:15px;
background:#212529;
color:white;
text-align:center;
}
</style>
</head>

<body>

<header>
Student Productivity Planner
</header>

<div class="container mt-5">

<div class="row g-4">

<div class="col-md-4">
<div class="card shadow p-4">
<h4>Daily Tasks</h4>

<input id="dailyInput" class="form-control" placeholder="Enter daily task">

<button class="btn btn-success mt-2" onclick="addTask('dailyInput','dailyList')">Add Task</button>

<ul id="dailyList" class="task-list mt-3"></ul>
</div>
</div>

<div class="col-md-4">
<div class="card shadow p-4">
<h4>Monthly Goals</h4>

<input id="monthlyInput" class="form-control" placeholder="Enter monthly goal">

<button class="btn btn-primary mt-2" onclick="addTask('monthlyInput','monthlyList')">Add Goal</button>

<ul id="monthlyList" class="task-list mt-3"></ul>
</div>
</div>

<div class="col-md-4">
<div class="card shadow p-4">
<h4>Yearly Targets</h4>

<input id="yearlyInput" class="form-control" placeholder="Enter yearly target">

<button class="btn btn-warning mt-2" onclick="addTask('yearlyInput','yearlyList')">Add Target</button>

<ul id="yearlyList" class="task-list mt-3"></ul>
</div>
</div>

</div>

<div class="card shadow p-4 mt-5">
<h4>Progress Dashboard</h4>

<p id="progressText">Completed 0 of 0 tasks</p>

<div class="progress">
<div id="progressBar" class="progress-bar bg-success" style="width:0%"></div>
</div>

</div>

</div>

<footer>
Student Planner Web App
</footer>

<script>

let totalTasks = 0
let completedTasks = 0

function addTask(inputId,listId){

let input=document.getElementById(inputId)
let text=input.value.trim()

if(text===""){
alert("Enter a task")
return
}

let li=document.createElement("li")

let checkbox=document.createElement("input")
checkbox.type="checkbox"

checkbox.onclick=function(){

if(this.checked){
completedTasks++
}else{
completedTasks--
}

updateProgress()

}

let label=document.createElement("span")
label.innerText=text

let del=document.createElement("button")
del.innerText="Delete"
del.className="btn btn-sm btn-danger"

del.onclick=function(){
li.remove()
totalTasks--
updateProgress()
}

li.appendChild(checkbox)
li.appendChild(label)
li.appendChild(del)

document.getElementById(listId).appendChild(li)

totalTasks++

input.value=""

updateProgress()

}

function updateProgress(){

let percent=0

if(totalTasks>0){
percent=(completedTasks/totalTasks)*100
}

document.getElementById("progressText").innerText=
"Completed "+completedTasks+" of "+totalTasks+" tasks"

document.getElementById("progressBar").style.width=percent+"%"

}

</script>

</body>
</html>
