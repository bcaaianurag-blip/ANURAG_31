<script>

let totalTasks = 0
let completedTasks = 0

function saveTasks(){
localStorage.setItem("plannerData",document.body.innerHTML)
}

function loadTasks(){
let data = localStorage.getItem("plannerData")
if(data){
document.body.innerHTML = data
}
}

window.onload = function(){
updateProgress()
}

function addTask(inputId,listId){

let input=document.getElementById(inputId)
let text=input.value.trim()

if(text===""){
alert("Enter a task")
return
}

let li=document.createElement("li")

let checkbox=document.createElement("input")
checkbox.type="checkbox"

checkbox.onclick=function(){
if(this.checked){
completedTasks++
}else{
completedTasks--
}
updateProgress()
saveTasks()
}

let label=document.createElement("span")
label.innerText=text

let del=document.createElement("button")
del.innerText="Delete"
del.className="btn btn-sm btn-danger"

del.onclick=function(){
li.remove()
totalTasks--
updateProgress()
saveTasks()
}

li.appendChild(checkbox)
li.appendChild(label)
li.appendChild(del)

document.getElementById(listId).appendChild(li)

totalTasks++
input.value=""

updateProgress()
saveTasks()

}

function updateProgress(){

let percent=0

if(totalTasks>0){
percent=(completedTasks/totalTasks)*100
}

document.getElementById("progressText").innerText=
"Completed "+completedTasks+" of "+totalTasks+" tasks"

document.getElementById("progressBar").style.width=percent+"%"

}

</script>
